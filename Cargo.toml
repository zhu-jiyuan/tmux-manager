[package]
name = "tm"
version = "0.7.1"
edition = "2024"
description = "tmux session switcher on fzf, with agent activity dots"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
